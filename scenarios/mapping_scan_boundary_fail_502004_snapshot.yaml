name: mapping_scan_boundary_fail_502004_snapshot
description: >-
  自动寻边失败（502004）HTTP 快照恢复场景。寻边阶段只静默写入 502004（不发 WS），
  测试者退出建图页再进入（或杀 App 重开），由建图页聚焦触发的
  robot/errors/unhandled 快照恢复出光晕插画；60 秒后 WS recovery 清除。
  error_type 名称尚无设备侧真源，暂用占位 NoLawnEdgeFound（App 只认 error_id）。
guide:
  title: 建图 - 自动寻边失败 502004 快照恢复
  domain_label: 建图
  summary: 验证 502004 仅存在于 HTTP unhandled 快照时，重进建图页 / 冷启动仍恢复出光晕插画与专属文案。
  when_to_use: >-
    验证错过 WS 推送（App 在后台、被杀、重进页面）时，502004 寻边失败画面能靠 HTTP 快照还原。
  simulates:
    - 寻边阶段静默写入 502004 到 unhandled 快照，不发送 ROBOT_ERROR
    - 保持 MAP_SCAN_BOUNDARY，不把异常写入建图 FSM
    - 60 秒后推送 ROBOT_ERROR_RECOVERY 恢复 502004
  prerequisites:
    - 已启动 map_mock_service，App mock 指向当前服务
    - App 已登录且 WS 已连接
  user_steps:
    - 打开 /sim/panel，选择 mapping_scan_boundary_fail_502004_snapshot
    - 点击“运行场景”，等待 App 进入自动建图页并显示蓝色雷达
    - 看到面板日志出现 502004 写入后，App 上应仍是雷达（快照不推 WS）
    - 60 秒内退出建图页再进入，或杀掉 App 重开进入建图页
    - 检查：中心区为粉色光晕 + 机器图，横幅为「自动建图中断，未识别到草坪边缘，请遥控设备沿着草坪边缘行驶」
    - 等待 recovery 后光晕消失、回到雷达，场景进入建图完成等待页并自动结束
  auto_behavior:
    - setup 为 IDLE，自动推进离桩 → 寻边
    - 寻边雷达展示 5 秒后静默写入 502004 快照
    - 留 60 秒给测试者重进页面，然后 WS recovery
    - 恢复后停留 5 秒，推进沿边 → MAP_COMPLETING，场景自动结束
  duration: 约 90 秒
  pushes:
    - NOTIFY_RATEL_STATUS
    - ROBOT_ERROR_RECOVERY
    - HTTP POST /ratel/api/v1/robot/errors/unhandled
domain: mapping
dataset: mapping_happy
setup:
  state: IDLE
  phase: null
steps:
  - emit: { type: CMD_START, mode: auto, taskMode: MAP_BUILD }
  - notify: { work_status: mapping, sub_status: precondition }
  - expect: { state: PREPARING }
  - wait: 2s
  - notify: { work_status: mapping, sub_status: leave_dock }
  - expect: { state: UNDOCKING }
  - wait: 2s
  - notify: { work_status: mapping, sub_status: find_boundary }
  - expect: { state: WORKING, phase: MAP_SCAN_BOUNDARY, mode: auto }
  - wait: 5s
  - note: snapshot_502004_written_reenter_mapping_page_now
  - robotErrorSnapshot:
      error_id: '502004'
      error_type: NoLawnEdgeFound
      error_level: Warn
  - expect: { state: WORKING, phase: MAP_SCAN_BOUNDARY, mode: auto }
  - wait: 60s
  - note: snapshot_502004_recovered
  - robotErrorRecovery: { error_id: '502004' }
  - expect: { state: WORKING, phase: MAP_SCAN_BOUNDARY, mode: auto }
  - wait: 5s
  - notify: { work_status: mapping, sub_status: edge_mapping }
  - expect: { state: WORKING, phase: MAP_FOLLOW_BOUNDARY, mode: auto }
  - wait: 3s
  - notify: { work_status: mapping, sub_status: map_edge_finish }
  - expect: { state: WORKING, phase: MAP_BOUNDARY_DONE }
  - wait: 2s
  - notify: { work_status: mapping, sub_status: expand_area }
  - expect: { state: WORKING, phase: MAP_COMPLETING }

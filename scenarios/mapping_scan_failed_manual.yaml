name: mapping_scan_failed_manual
description: Scan failure at find_boundary + switch manual (WS phase + CMD)
guide:
  title: 建图 — 扫边失败转遥控
  domain_label: 建图
  summary: 模拟 find_boundary 阶段扫描失败，进入失败 phase 并切换手动遥控。
  when_to_use: 验证扫边失败提示、REMOTE_CONTROL 与手动模式 UI。
  simulates:
    - NOTIFY 进入扫边阶段后 DEVICE_ERROR（SCAN_BOUNDARY_FAILED）
    - CMD_SWITCH_MANUAL 进入遥控
  prerequisites:
    - App 已建图 start；场景从 UNDOCKING 开始
  user_steps:
    - 选择 mapping_scan_failed_manual 并运行
    - 在 App 观察是否出现失败态/遥控相关 UI（若已接好映射）
  auto_behavior:
    - leave_dock → find_boundary → 注入 recoverable 错误 → SWITCH_MANUAL
  duration: 约 40 秒
  pushes:
    - NOTIFY_RATEL_STATUS
domain: mapping
setup:
  state: UNDOCKING
  phase: null
steps:
  - notify: { work_status: mapping, sub_status: leave_dock }
  - expect: { state: UNDOCKING }
  - wait: 6s
  - notify: { work_status: mapping, sub_status: find_boundary }
  - expect: { state: WORKING, phase: MAP_SCAN_BOUNDARY }
  - wait: 12s
  - emit: { type: DEVICE_ERROR, code: SCAN_BOUNDARY_FAILED, recoverable: true }
  - expect:
      state: WORKING
      phase: MAP_SCAN_BOUNDARY_FAILED
      error: { code: SCAN_BOUNDARY_FAILED, recoverable: true }
  - wait: 8s
  - emit: { type: CMD_SWITCH_MANUAL }
  - expect: { state: REMOTE_CONTROL, phase: MAP_SCAN_BOUNDARY_FAILED }

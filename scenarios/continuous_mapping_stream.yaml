name: continuous_mapping_stream
description: keep mapping in streamable phases long enough to inspect incremental map rendering
domain: mapping
setup:
  state: PREPARING
  phase: MAP_PRECHECK
  capabilities: { canSwitchManual: false, canSwitchAuto: false }
steps:
  - emit: { type: DEVICE_WORK_STATUS, status: mapping }
  - expect: { state: UNDOCKING }
  - emit: { type: DEVICE_PHASE, phase: MAP_SCAN_BOUNDARY }
  - expect: { state: WORKING, phase: MAP_SCAN_BOUNDARY }
  - note: streaming MAP_INCREMENTAL during boundary scan for 30s
  - wait: 30s
  - emit: { type: DEVICE_PHASE, phase: MAP_FOLLOW_BOUNDARY }
  - expect: { phase: MAP_FOLLOW_BOUNDARY }
  - note: streaming MAP_INCREMENTAL during boundary follow for 30s
  - wait: 30s
  - emit: { type: DEVICE_PHASE, phase: MAP_COVERAGE_RUN }
  - expect: { phase: MAP_COVERAGE_RUN }
  - note: streaming MAP_INCREMENTAL during coverage run for 30s
  - wait: 30s
  - emit: { type: DEVICE_PHASE, phase: MAP_COVERAGE_DONE }
  - emit: { type: CMD_CONFIRM }
  - expect: { state: COMPLETED, phase: MAP_COVERAGE_DONE }
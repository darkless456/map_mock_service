name: notice_new_area_auto_and_remote
description: new-area notice can start auto scan and remote/manual follow flows
domain: mapping
setup:
  state: WORKING
  phase: MAP_BOUNDARY_WAIT
  mode: auto
steps:
  - emit:
      type: DEVICE_NOTICE
      notice: { id: n-auto, kind: new_area_available, mode: auto, ts: 1 }
  - expect: { state: WORKING, phase: MAP_BOUNDARY_WAIT }
  - emit: { type: CMD_ADD_NEW_AREA, mode: auto }
  - expect: { state: WORKING, phase: MAP_SCAN_BOUNDARY, mode: auto }
  - note: reset to boundary wait and test remote mode
  - emit: { type: DEVICE_PHASE, phase: MAP_BOUNDARY_WAIT }
  - emit:
      type: DEVICE_NOTICE
      notice: { id: n-remote, kind: new_area_available, mode: remote, ts: 2 }
  - emit: { type: CMD_ADD_NEW_AREA, mode: remote }
  - expect: { state: REMOTE_CONTROL, phase: MAP_FOLLOW_BOUNDARY_MANUAL, mode: remote }

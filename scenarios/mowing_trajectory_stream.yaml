name: mowing_trajectory_stream
description: keep mowing active long enough to inspect ROBOT_LOCATION trajectory rendering
domain: mowing
setup:
  state: IDLE
  phase: null
steps:
  - emit: { type: CMD_START, mode: auto, taskMode: MOW_GLOBAL }
  - expect: { state: PREPARING }
  - emit: { type: DEVICE_REPORT_STARTED }
  - expect: { state: WORKING, phase: MOW_RUNNING, activeTask: { status: ON_THE_WAY } }
  - note: pushing ROBOT_LOCATION every 300ms for subscribed clients for 60s
  - wait: 60s
  - emit: { type: DEVICE_REPORT_FINISHED }
  - expect: { state: COMPLETED, phase: MOW_RUNNING, activeTask: { status: COMPLETE } }
name: boundary_close_failed_then_retry_remote
description: remote/manual boundary closing failure can retry without losing mode
domain: mapping
setup:
  state: WORKING
  phase: MAP_BOUNDARY_CLOSING
  mode: remote
steps:
  - emit: { type: DEVICE_ERROR, code: BOUNDARY_CLOSE_FAILED, recoverable: true }
  - expect: { state: WORKING, phase: MAP_BOUNDARY_CLOSE_FAILED, mode: remote }
  - emit: { type: CMD_RETRY }
  - expect: { state: WORKING, phase: MAP_BOUNDARY_CLOSING, mode: remote }

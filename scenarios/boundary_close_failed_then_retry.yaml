name: boundary_close_failed_then_retry
description: boundary closing recoverable error can retry to closing phase
domain: mapping
setup:
  state: WORKING
  phase: MAP_BOUNDARY_CLOSING
steps:
  - emit: { type: DEVICE_ERROR, code: BOUNDARY_CLOSE_FAILED, recoverable: true }
  - expect: { state: WORKING, phase: MAP_BOUNDARY_CLOSE_FAILED, error: { code: BOUNDARY_CLOSE_FAILED } }
  - emit: { type: CMD_RETRY }
  - expect: { state: WORKING, phase: MAP_BOUNDARY_CLOSING, error: null }

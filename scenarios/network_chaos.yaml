name: network_chaos
description: latency/drop chaos plus network loss pause path
domain: mapping
setup:
  state: WORKING
  phase: MAP_SCAN_BOUNDARY
steps:
  - chaos: { latencyMs: 800, dropRate: 0.2, reorderWindowMs: 100 }
  - emit: { type: LINK_NET_LOST }
  - expect: { state: PAUSED, phase: MAP_SCAN_BOUNDARY }
  - chaos: { latencyMs: 0, dropRate: 0, reorderWindowMs: 0 }

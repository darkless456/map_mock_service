name: happy_mowing
description: mowing start -> running -> completed
domain: mowing
setup:
  state: IDLE
  phase: null
steps:
  - emit: { type: CMD_START, mode: auto, taskMode: MOW_GLOBAL }
  - expect: { state: PREPARING }
  - emit: { type: DEVICE_REPORT_STARTED }
  - expect: { state: WORKING, phase: MOW_RUNNING }
  - emit: { type: DEVICE_REPORT_FINISHED }
  - expect: { state: COMPLETED, phase: MOW_RUNNING }

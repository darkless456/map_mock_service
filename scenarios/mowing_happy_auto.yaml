name: mowing_happy_auto
description: >-
  WS NOTIFY_RATEL_STATUS mowing flow (align backend-status-mapper §5.2).
  Assumes App already called ratel_task/create (PREPARING). Drives home mowing UI.
guide:
  title: 割草 — NOTIFY 主流程（短）
  domain_label: 割草
  summary: 推送割草 NOTIFY 链至 WORKING/MOW_RUNNING，短时 ON_THE_WAY，不侧重轨迹长度。
  when_to_use: 快速验证割草主页 FSM、按钮态与 NOTIFY_MOW_STATUS，不跑长轨迹。
  simulates:
    - map_check → leave_dock → mowing 的 NOTIFY_RATEL_STATUS
    - 任务保持 ON_THE_WAY 约 10s
  prerequisites:
    - App mock 指向模拟器；WS 已连接
    - App 已 POST 创建割草任务（PREPARING）
  user_steps:
    - App 割草主页发起创建任务
    - Panel 选择 mowing_happy_auto → 运行
    - 观察割草 UI 与 mowing.state / phase
  auto_behavior:
    - setup PREPARING，按步骤 notify + expect
  duration: 约 25 秒
  pushes:
    - NOTIFY_RATEL_STATUS
    - NOTIFY_MOW_STATUS（FSM 变化时）
domain: mowing
setup:
  state: PREPARING
  phase: null
steps:
  - notify: { work_status: mowing, sub_status: map_check }
  - wait: 3s
  - notify: { work_status: mowing, sub_status: leave_dock }
  - expect: { state: UNDOCKING }
  - wait: 5s
  - notify: { work_status: mowing, sub_status: mowing }
  - expect: { state: WORKING, phase: MOW_RUNNING }
  - wait: 10s

name: capabilities_toggle
description: capability flags can be toggled independently from phase
domain: mapping
setup:
  state: WORKING
  phase: MAP_BOUNDARY_WAIT
  capabilities: { canSwitchManual: false, canSwitchAuto: false }
steps:
  - emit: { type: DEVICE_CAPABILITIES, capabilities: { canSwitchManual: true, canSwitchAuto: false } }
  - expect: { capabilities: { canSwitchManual: true, canSwitchAuto: false } }
  - emit: { type: DEVICE_CAPABILITIES, capabilities: { canSwitchManual: false, canSwitchAuto: true } }
  - expect: { capabilities: { canSwitchManual: false, canSwitchAuto: true } }

name: mowing_task_normal
description: >-
  Normal cloud mowing task (backend §5.2): map_check → leave_dock → mowing → long
  ON_THE_WAY hold. ROBOT_LOCATION follows the semantic-zero grass route from
  full_semanticmap.png (lane spacing 0.4m, step 0.1m, 300ms). Assumes the App
  already called POST ratel_task/create (PREPARING) and sends LOCATION_REGISTER.
guide:
  title: 割草 — 正常任务 + 语义地图轨迹（推荐）
  domain_label: 割草
  summary: >-
    完整割草 NOTIFY 流程，ON_THE_WAY 保持 90s；ROBOT_LOCATION 沿 full_semanticmap.png
    草地语义区域弓字形路线移动（300ms/帧）。
  when_to_use: >-
    联调割草主页地图上的机器人图标、轨迹线、已割区域；与真实 App 流程一致（先 HTTP 建任务再登记位置）。
  simulates:
    - 完整 §5.2 NOTIFY（含 return_dock、idle 结束）
    - ON_THE_WAY 时按语义地图生成路线 reset 后推进
    - 对已 LOCATION_REGISTER 的 socket 广播 ROBOT_LOCATION
  prerequisites:
    - App 已 POST /ratel/central-control-service/api/v1/ratel_task/create
    - App 在割草活跃态发送 LOCATION_REGISTER（useLocationRegistration）
    - WS 已连接
  user_steps:
    - App 割草主页：创建任务 → 进入割草中 UI
    - 确认日志有 location.register.ok 与 ws.send LOCATION_REGISTER
    - Panel 选择 mowing_task_normal → 运行场景（或先运行场景再操作 App，但需任务 ON_THE_WAY）
    - 在地图页观察机器人沿草地黑区移动约 90s
    - 场景结束后检查 COMPLETE
  auto_behavior:
    - setup PREPARING；notify 全流程；90s 位置流；return_dock → idle
    - 每次进入 ON_THE_WAY 轨迹从路线起点重置
  duration: 约 2 分钟
  pushes:
    - NOTIFY_RATEL_STATUS
    - NOTIFY_MOW_STATUS
    - ROBOT_LOCATION（300ms，需登记）
domain: mowing
setup:
  state: PREPARING
  phase: null
steps:
  - notify: { work_status: mowing, sub_status: map_check }
  - expect: { state: PREPARING }
  - wait: 3s
  - notify: { work_status: mowing, sub_status: leave_dock }
  - expect: { state: UNDOCKING }
  - wait: 5s
  - notify: { work_status: mowing, sub_status: mowing }
  - expect: { state: WORKING, phase: MOW_RUNNING, task_status: ON_THE_WAY }
  - note: >-
      ON_THE_WAY — register LOCATION_REGISTER on the App; mock resets trajectory
      at route start and streams ROBOT_LOCATION along the semantic map (~90s).
  - wait: 90s
  - notify: { work_status: mowing, sub_status: return_dock }
  - expect: { phase: returning }
  - wait: 8s
  - notify: { work_status: idle, sub_status: none }
  - expect: { state: COMPLETED, task_status: COMPLETE }

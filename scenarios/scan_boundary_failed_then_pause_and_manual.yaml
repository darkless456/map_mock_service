name: scan_boundary_failed_then_pause_and_manual
description: scan failure, pause, then switch to remote manual mode when capability is enabled
domain: mapping
setup:
  state: WORKING
  phase: MAP_SCAN_BOUNDARY
  mode: auto
  capabilities: { canSwitchManual: false, canSwitchAuto: false }
steps:
  - emit: { type: DEVICE_ERROR, code: E_NO_BORDER, recoverable: true }
  - expect: { state: WORKING, phase: MAP_SCAN_BOUNDARY_FAILED }
  - emit: { type: CMD_PAUSE }
  - expect: { state: PAUSED }
  - emit: { type: DEVICE_CAPABILITIES, capabilities: { canSwitchManual: true, canSwitchAuto: false } }
  - expect: { capabilities: { canSwitchManual: true } }
  - emit: { type: CMD_SWITCH_MANUAL }
  - expect: { state: REMOTE_CONTROL, mode: remote }
